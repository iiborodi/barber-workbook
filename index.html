<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barber Workbook — рабочая тетрадь начинающего барбера</title>
<meta name="description" content="Учебный курс для начинающего барбера: теория, видео, чек-листы практики, тесты по темам и итоговый экзамен с сертификатом.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂</text></svg>">
<style>
/* ============ BARBER WORKBOOK — theme ============ */
:root{
  --bg:#0d0e10;
  --bg2:#131519;
  --card:#191c21;
  --card2:#1f232a;
  --line:#2b3038;
  --txt:#ece7df;
  --muted:#959ca6;
  --accent:#d9a44c;
  --accent2:#f0cf94;
  --ok:#5fbf85;
  --bad:#e2705f;
  --info:#6aa8d8;
  --r:14px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(217,164,76,.10), transparent 60%),
    radial-gradient(700px 400px at 100% 0%, rgba(120,90,200,.07), transparent 55%),
    var(--bg);
  color:var(--txt);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.25;letter-spacing:-.01em}
h1{font-size:clamp(26px,4vw,38px);font-weight:800}
h2{font-size:clamp(20px,2.6vw,26px);font-weight:750}
h3{font-size:17px;font-weight:700}
p{margin:0 0 .85em}
a{color:var(--accent);text-decoration:none}
small{color:var(--muted)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---- top bar ---- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(13,14,16,.82);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar:before{
  content:"";display:block;height:3px;
  background:repeating-linear-gradient(115deg,#d9a44c 0 14px,#f2ece3 14px 28px,#c0392b 28px 42px,#1b1e23 42px 56px);
  opacity:.85;
}
.tb-inner{display:flex;align-items:center;gap:18px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.brand .mark{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),#a9741f);
  color:#16120a;font-size:16px;font-weight:900;
}
.brand span.sub{color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{
  padding:8px 13px;border-radius:10px;color:var(--muted);font-weight:600;font-size:13.5px;
  transition:.15s;white-space:nowrap;
}
nav.main a:hover{color:var(--txt);background:var(--card)}
nav.main a.on{color:#171307;background:linear-gradient(145deg,var(--accent),#c08e38)}
.userchip{
  display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border-radius:30px;
  background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.15s;
}
.userchip:hover{border-color:var(--accent)}
.ava{
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-size:12.5px;color:#14100a;background:var(--accent);flex:0 0 auto;
}
.userchip b{font-size:13.5px;font-weight:650;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- layout ---- */
main{padding:30px 0 80px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:840px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}.tb-inner{height:auto;padding:10px 0;flex-wrap:wrap}nav.main{margin-left:0;order:3;width:100%;overflow-x:auto}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.tight{padding:16px}
.hero{
  background:linear-gradient(135deg,#20242b,#15181c 60%);
  border:1px solid var(--line);border-radius:20px;padding:28px;position:relative;overflow:hidden;
}
.hero:after{
  content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(217,164,76,.22),transparent 70%);
}
.eyebrow{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px}

/* ---- stats ---- */
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat .k{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:650}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stat .v small{font-size:13px;font-weight:600;color:var(--muted)}

/* ---- progress ---- */
.bar{height:8px;border-radius:99px;background:#282d35;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#c08e38,var(--accent2));transition:width .5s cubic-bezier(.3,1,.4,1)}
.bar.thin{height:5px}
.ring{--p:0;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),#282d35 0);
  position:relative}
.ring:after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--card)}
.ring b{position:relative;z-index:1;font-size:23px;font-weight:800}
.ring b small{font-size:11px;display:block;color:var(--muted);font-weight:600;letter-spacing:.1em}

/* ---- module / lesson cards ---- */
.mod{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.mod-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;transition:.15s}
.mod-head:hover{background:var(--card2)}
.mod-num{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  background:#232830;border:1px solid var(--line);font-weight:800;color:var(--accent);font-size:14px;
}
.mod.done .mod-num{background:linear-gradient(145deg,var(--accent),#a9741f);color:#14100a;border-color:transparent}
.mod-head h3{margin:0;font-size:16px}
.mod-head .meta{font-size:12.5px;color:var(--muted)}
.mod-body{border-top:1px solid var(--line);padding:8px}
.lesson-row{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;cursor:pointer;transition:.13s;
}
.lesson-row:hover{background:var(--card2)}
.lesson-row.locked{opacity:.42;cursor:not-allowed}
.lesson-row .dot{
  width:22px;height:22px;border-radius:50%;border:2px solid #3a4048;flex:0 0 auto;
  display:grid;place-items:center;font-size:11px;font-weight:800;color:#14100a;
}
.lesson-row.ok .dot{background:var(--ok);border-color:var(--ok)}
.lesson-row.partial .dot{border-color:var(--accent);background:rgba(217,164,76,.15)}
.lesson-row .t{flex:1;min-width:0}
.lesson-row .t b{display:block;font-size:14.5px;font-weight:650}
.lesson-row .t span{font-size:12px;color:var(--muted)}
.pill{
  font-size:11px;padding:3px 9px;border-radius:99px;background:#262b33;color:var(--muted);
  font-weight:700;letter-spacing:.04em;white-space:nowrap;
}
.pill.gold{background:rgba(217,164,76,.16);color:var(--accent2)}
.pill.ok{background:rgba(95,191,133,.16);color:var(--ok)}
.pill.bad{background:rgba(226,112,95,.16);color:var(--bad)}

/* ---- buttons ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:11px;border:1px solid var(--line);background:var(--card2);
  color:var(--txt);font:inherit;font-weight:650;font-size:14px;cursor:pointer;transition:.15s;
}
.btn:hover{background:#262b33;border-color:#3a4149}
.btn.primary{background:linear-gradient(145deg,var(--accent),#c08e38);color:#171307;border-color:transparent;box-shadow:0 6px 18px rgba(217,164,76,.22)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}

/* ---- theory ---- */
.theory{font-size:15.5px;line-height:1.75}
.theory h3{margin:26px 0 8px;color:var(--accent2);font-size:16px;letter-spacing:.01em}
.theory h3:first-child{margin-top:0}
.theory ul,.theory ol{margin:0 0 14px;padding-left:22px}
.theory li{margin-bottom:6px}
.theory b,.theory strong{color:#fff}
.theory code{background:#262b33;padding:2px 6px;border-radius:5px;font-size:13px}
.callout{
  border-left:3px solid var(--accent);background:rgba(217,164,76,.07);
  padding:12px 16px;border-radius:0 10px 10px 0;margin:0 0 14px;font-size:14.5px;
}
.callout.warn{border-color:var(--bad);background:rgba(226,112,95,.08)}
.callout.info{border-color:var(--info);background:rgba(106,168,216,.08)}
.callout b{display:block;margin-bottom:3px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.callout.warn b{color:var(--bad)}
.callout.info b{color:var(--info)}
table{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
tbody tr:hover{background:var(--card2)}

/* ---- video ---- */
.video-box{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000;position:relative;aspect-ratio:16/9}
.video-box iframe,.video-box video{width:100%;height:100%;border:0;display:block}
.video-empty{
  aspect-ratio:16/9;border-radius:12px;border:1.5px dashed #3a4149;background:var(--card2);
  display:grid;place-items:center;text-align:center;padding:20px;gap:6px;
}
.video-empty .ico{font-size:30px;opacity:.5}
.video-empty p{margin:0;font-size:13.5px;color:var(--muted);max-width:320px}

/* ---- notes / checklist ---- */
textarea,input[type=text],input[type=password]{
  width:100%;background:#12151a;border:1px solid var(--line);border-radius:10px;color:var(--txt);
  padding:12px 14px;font:inherit;font-size:14.5px;resize:vertical;outline:none;transition:.15s;
}
textarea:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,164,76,.12)}
.check{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-radius:10px;cursor:pointer;transition:.12s}
.check:hover{background:var(--card2)}
.check input{appearance:none;width:19px;height:19px;border:2px solid #3a4149;border-radius:6px;flex:0 0 auto;margin-top:2px;cursor:pointer;position:relative;transition:.15s}
.check input:checked{background:var(--ok);border-color:var(--ok)}
.check input:checked:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#0d120e;font-weight:900}
.check span{font-size:14.5px}
.check input:checked+span{color:var(--muted);text-decoration:line-through}

/* ---- quiz ---- */
.q{margin-bottom:22px}
.q .qt{font-weight:650;margin-bottom:10px;font-size:15.5px;line-height:1.5}
.opt{
  display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-radius:10px;
  border:1px solid var(--line);background:#14171c;cursor:pointer;margin-bottom:8px;transition:.13s;
}
.opt:hover{border-color:#3d444d;background:var(--card2)}
.opt input{appearance:none;width:18px;height:18px;border:2px solid #3a4149;border-radius:50%;flex:0 0 auto;margin-top:2px;position:relative;transition:.15s}
.opt input:checked{border-color:var(--accent)}
.opt input:checked:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.opt.sel{border-color:var(--accent);background:rgba(217,164,76,.08)}
.opt.right{border-color:var(--ok);background:rgba(95,191,133,.1)}
.opt.wrong{border-color:var(--bad);background:rgba(226,112,95,.1)}
.opt .mark{margin-left:auto;font-weight:800;font-size:13px}
.explain{font-size:13.5px;color:var(--muted);padding:8px 14px;border-left:2px solid var(--line);margin-bottom:8px}

/* ---- result ---- */
.score-big{font-size:64px;font-weight:850;letter-spacing:-.04em;line-height:1}
.cert{
  background:
    radial-gradient(600px 300px at 50% -20%, rgba(217,164,76,.18), transparent 70%),
    linear-gradient(160deg,#f7f2e7,#e9e0cd);
  color:#1b1710;border-radius:18px;padding:38px 34px;text-align:center;border:1px solid #cbb98f;
  box-shadow:var(--shadow);
}
.cert .seal{width:66px;height:66px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
  background:linear-gradient(145deg,#d9a44c,#a9741f);color:#241b08;font-weight:900;font-size:26px;border:3px solid #f7f2e7;box-shadow:0 0 0 1px #cbb98f}
.cert h2{font-size:26px;letter-spacing:.02em;margin-bottom:4px}
.cert .who{font-size:30px;font-weight:850;margin:14px 0 6px;letter-spacing:-.01em}
.cert .meta{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#6d5c3a;font-weight:700}

/* ---- badges ---- */
.badge{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.badge.off{opacity:.4;filter:grayscale(1)}
.badge .bi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(217,164,76,.15);font-size:17px;flex:0 0 auto}
.badge b{display:block;font-size:13.5px}
.badge small{font-size:11.5px;line-height:1.4;display:block}

/* ---- table rating ---- */
.rank{display:flex;align-items:center;gap:13px;padding:12px 6px;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .pos{width:26px;text-align:center;font-weight:800;color:var(--muted)}
.rank.me{background:rgba(217,164,76,.07);border-radius:10px}
.rank .num{margin-left:auto;font-weight:800;font-size:17px;color:var(--accent2)}

/* ---- auth ---- */
.auth{min-height:100vh;display:grid;place-items:center;padding:30px 20px}
.auth .box{width:100%;max-width:430px}
.profile-pick{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--card2);cursor:pointer;margin-bottom:8px;transition:.13s}
.profile-pick:hover{border-color:var(--accent);transform:translateX(2px)}

/* ---- misc ---- */
.hidden{display:none!important}
@media(max-width:900px){
  #lessonGrid{grid-template-columns:1fr!important}
  #sidebar{position:static!important}
  #sidebar .card{display:block}
}
@media(max-width:640px){
  .card{padding:16px}
  .hero{padding:20px}
  .cert{padding:26px 18px}
  .cert .who{font-size:23px}
  .score-big{font-size:48px}
  .grid.badges{grid-template-columns:1fr!important}
  .q .opt{padding:10px 12px}
}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.mt{margin-top:18px}.mt-s{margin-top:10px}.mb{margin-bottom:18px}
.divider{height:1px;background:var(--line);margin:20px 0}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120%);z-index:90;
  background:#22272e;border:1px solid var(--accent);color:var(--txt);padding:12px 20px;border-radius:12px;
  font-weight:600;font-size:14px;box-shadow:var(--shadow);transition:.35s cubic-bezier(.2,1,.3,1);max-width:90vw}
#toast.show{transform:translate(-50%,0)}
.modal-backdrop{position:fixed;inset:0;background:rgba(6,7,8,.72);backdrop-filter:blur(4px);z-index:80;display:grid;place-items:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:440px;width:100%;box-shadow:var(--shadow)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px}
.timer.low{color:var(--bad)}
@media print{
  .topbar,nav,footer,.no-print{display:none!important}
  body{background:#fff;color:#000}
  .cert{box-shadow:none}
}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   BARBER WORKBOOK — теория и тесты (модуль курсов)
   ============================================================ */
window.COURSE = {
  modules: [
    {
      id: "m1",
      title: "Гигиена и безопасность",
      subtitle: "Старт любого мастера — стерильность",
      lessons: [
        {
          id: "m1l1",
          title: "Персональная гигиена мастера",
          time: "8 мин",
          video: "https://www.youtube.com/embed/L4CfwqR08Hk",
          theory: `
<h3>С чего начинается работа — с чистых рук</h3>
<p>Гигиена — не формальность, а <b>часть ремесла</b>. Клиент оценивает мастерскую по мелочам: запах, чистота инструментов, внешний вид барбера. Негромкая работа начинается <b>до</b> клиента: руки, фартук или халат, волосы убраны.</p>
<div class="callout"><b>Правило №1</b>Мытьё рук — до и после каждого клиента, а также после работы с телефоном и кассой.</div>
<h3>Как мыть руки правильно</h3>
<ol>
<li>Намыливание с тыльной стороной ладоней, между пальцами и под ногтями — не менее <b>20 секунд</b>.</li>
<li>Промывание чистой проточной водой.</li>
<li>Сушка одноразовым полотенцем — общее бумажное полотенце не использовать.</li>
</ol>
<h3>Антибактериальный уход</h3>
<p>Растворы на спирту (хлоргексидин 0,05–0,5%, спирт) используют <b>между</b> клиентами и в течение дня, когда нет возможности полностью помыть руки. Но мытьё — это базовый минимум, дезинфекция рук — дополнение, а не замена.</p>
<div class="callout warn"><b>Частая ошибка новичков</b>Коротко сполоснуть руки «на бегу». Так мыло не успевает подействовать — считайте 20 секунд вслух или в уме, это 30 секунд без спешки.</div>`,
          checklist: [
            "Я мою руки минимум 20 секунд до и после каждого клиента",
            "Под рукой всегда есть антисептик для рук",
            "Свои руки и ногти ухожены, одежда чистая",
            "Я не работаю с симптомами ОРВИ: отстраняюсь от клиентов"
          ],
          quiz: [
            {
              q: "Сколько секунд должно длиться настоящее мытьё рук с мылом?",
              options: ["5–10 секунд", "Не менее 20 секунд", "Одно мгновение — достаточно", "Чем дольше, тем лучше — час"],
              correct: 1,
              explain: "20 секунд — минимально, чтобы пенное мыло успело подействовать на микробы. Скорость не важна, важна длительность."
            },
            {
              q: "Когда обязательно надо мыть руки во время работы?",
              options: [
                "Только в начале смены",
                "Только в конце смены",
                "До и после каждого клиента, и после контакта с кассой/телефоном",
                "Если руки выглядят грязными"
              ],
              correct: 2,
              explain: "Контакт с телефоном, кассой, дверью переносит микробы на руки — мытьё нужно после любого контакта, а не только «когда грязно»."
            }
          ]
        },
        {
          id: "m1l2",
          title: "Дезинфекция и стерилизация инструментов",
          time: "12 мин",
          video: "https://www.youtube.com/embed/N7B-EiqbzNg",
          theory: `
<h3>Три уровня обработки</h3>
<p>Всё оборудование делится на три группы по степени контакта с кровью и слизистыми:</p>
<table>
<thead><tr><th>Группа</th><th>Примеры</th><th>Что делать</th></tr></thead>

        q: "Что делать между зонами разных насадок?",
        options: [
          "Ничего",
          "«Перетереть»: пройтись более короткой насадкой по границе",
          "Увеличить насадку на 1 см",
          "Опустить насадку на 1 см"
        ],
        correct: 1
      },
      {
        q: "Как движется T-blade при создании линии?",
        options: [
          "На себя",
          "От себя, лезвие «входит» в кожу",
          "В любом направлении",
          "Вертикально вверх"
        ],
        correct: 1
      },
      {
        q: "Как часто нужен touch-up для фейда?",
        options: [
          "Раз в месяц",
          "Каждые 1–2 недели",
          "Только когда «очень проросло»",
          "Никогда"
        ],
        correct: 1
      }
    ]
  },
  // Бот-«напарники» для рейтинга
  bots: [
    { name: "Виктор «Вики» Орлов", skill: 92 },
    { name: "Марина Штерн", skill: 85 },
    { name: "Тимур Гареев", skill: 78 },
    { name: "Алексей «Лёха» Мельник", skill: 71 },
    { name: "Ксения Дуб", skill: 64 },
    { name: "Роман К.", skill: 55 },
    { name: "Иван Грошилов", skill: 41 },
    { name: "Настя П.", skill: 28 }
  ]
};

</script>
<script>
/* ============================================================
   BARBER WORKBOOK — приложение
   ============================================================ */
(function () {
  "use strict";

  const KEY = "barber_workbook_v1";
  const C = window.COURSE;
  const LESSONS = [];           // плоский список
  const LESSON_MAP = {};
  C.modules.forEach((m, mi) => {
    m.idx = mi + 1;
    m.lessons.forEach((l, li) => {
      l.modId = m.id;
      l.modTitle = m.title;
      l.idx = li + 1;
      l.globalIdx = LESSONS.length + 1;
      LESSONS.push(l);
      LESSON_MAP[l.id] = l;
    });
  });
  const TOTAL = LESSONS.length;

  /* ---------------- storage ---------------- */
  let DB = load();
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        d.users = d.users || {};
        d.progress = d.progress || {};
        d.videos = d.videos || {};
        return d;
      }
    } catch (e) { console.warn("load fail", e); }
    return { users: {}, progress: {}, videos: {}, session: null };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(DB)); }
    catch (e) { console.warn("save fail", e); }
  }

  const uid = () => "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  function hash(s) {
    let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return "h" + (h >>> 0).toString(36);
  }
  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

  let lastRouteKey = null;
  let hideSavedResult = false;

  function me() { return DB.session ? DB.users[DB.session] : null; }
  function prog() {
    const id = DB.session;
    if (!DB.progress[id]) DB.progress[id] = { lessons: {}, final: null };
    return DB.progress[id];
  }
  function lp(lessonId) {
    const p = prog();
    if (!p.lessons[lessonId]) {
      p.lessons[lessonId] = {
        read: false, video: false, notes: "",
        checklist: {}, quizBest: 0, quizTotal: 0, quizDone: false
      };
    }
    return p.lessons[lessonId];
  }

  /* ---------------- scoring ---------------- */
  const XP_READ = 10, XP_VIDEO = 5, XP_CHECK = 10, XP_Q = 10, XP_FINAL_Q = 10;

  function xpOf(userId) {
    const p = DB.progress[userId] || { lessons: {}, final: null };
    let xp = 0;
    LESSONS.forEach((l) => {
      const s = p.lessons[l.id];
      if (!s) return;
      if (s.read) xp += XP_READ;
      if (s.video) xp += XP_VIDEO;
      if (l.checklist && Object.values(s.checklist || {}).filter(Boolean).length === l.checklist.length) xp += XP_CHECK;
      xp += (s.quizBest || 0) * XP_Q;
    });
    if (p.final && p.final.passed) xp += (p.final.score || 0) * XP_FINAL_Q;
    return xp;
  }

  function levelOf(xp) {
    const L = [
      { n: 1, t: "Новичок", at: 0 },
      { n: 2, t: "Ученик", at: 120 },
      { n: 3, t: "Подмастерье", at: 300 },
      { n: 4, t: "Барбер-практик", at: 520 },
      { n: 5, t: "Мастер", at: 720 },
      { n: 6, t: "Гранд-мастер", at: 900 }
    ];
    let cur = L[0], next = null;
    L.forEach((l, i) => { if (xp >= l.at) { cur = l; next = L[i + 1] || null; } });
    return { cur, next };
  }

  function lessonComplete(l) {
    const s = (DB.progress[DB.session] || { lessons: {} }).lessons[l.id];
    if (!s) return false;
    return !!s.quizDone && s.quizTotal > 0 && (s.quizBest / s.quizTotal) >= 0.6;
  }
  function lessonStarted(l) {
    const s = (DB.progress[DB.session] || { lessons: {} }).lessons[l.id];
    return !!(s && (s.read || s.video || s.quizDone || Object.values(s.checklist || {}).some(Boolean)));
  }
  function overall() {
    if (!DB.session) return 0;
    const done = LESSONS.filter(lessonComplete).length;
    return Math.round(done / TOTAL * 100);
  }
  function finalUnlocked() {
    return LESSONS.filter(lessonComplete).length >= TOTAL;
  }

  /* ---------------- ui helpers ---------------- */
  const app = () => document.getElementById("app");
  let toastTimer;
  function toast(msg) {
    let t = document.getElementById("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }
  const initials = (n) => n.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
  const go = (h) => { location.hash = h; };

  /* ---------------- router ---------------- */
  window.addEventListener("hashchange", render);
  window.addEventListener("DOMContentLoaded", () => { restoreFinalState(); render(); });

  function route() {
    const h = (location.hash || "").replace(/^#\/?/, "");
    const parts = h.split("/").filter(Boolean);
    return { name: parts[0] || "home", arg: parts[1] || null };
  }

  function render() {
    const u = me();
    const r = route();
    if (!u && r.name !== "auth") { go("#/auth"); return; }
    if (u && r.name === "auth") { go("#/home"); return; }

    let html = "";
    switch (r.name) {
      case "auth": html = AppShell ? viewAuth() : viewAuth(); break;
      case "home": html = viewHome(); break;
      case "course": html = viewCourse(); break;
      case "lesson": html = viewLesson(r.arg); break;
      case "final": html = viewFinal(); break;
      case "profile": html = viewProfile(); break;
      case "rating": html = viewRating(); break;
      default: html = viewHome();
    }
    app().innerHTML = html;
    window.scrollTo(0, 0);
    postRender(r);
  }

  /* ---------------- shell ---------------- */
  let AppShell = true;

  function nav(active) {
    const u = me();
    const items = [
      ["home", "Главная"], ["course", "Курс"],
      ["final", "Экзамен"], ["rating", "Рейтинг"], ["profile", "Профиль"]
    ];
    return `
    <div class="topbar">
      <div class="wrap tb-inner">
        <div class="brand" onclick="location.hash='#/home'" style="cursor:pointer">
          <span class="mark">✂</span>
          <div>BARBER<span class="sub">WORKBOOK</span></div>
        </div>
        <nav class="main">
          ${items.map(([k, t]) => `<a href="#/${k}" class="${active === k ? "on" : ""}">${t}</a>`).join("")}
        </nav>
        ${u ? `<div class="userchip" onclick="location.hash='#/profile'">
          <div class="ava">${esc(initials(u.name))}</div>
          <b>${esc(u.name)}</b>
        </div>` : ""}
      </div>
    </div>`;
  }

  function shell(active, content) {
    return nav(active) + `<main><div class="wrap">${content}</div></main>`;
  }

  /* ---------------- AUTH ---------------- */
  function viewAuth() {
    const users = Object.values(DB.users).sort((a, b) => b.createdAt - a.createdAt);
    return `
    <div class="auth"><div class="box">
      <div style="text-align:center;margin-bottom:26px">
        <div style="width:58px;height:58px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(145deg,#d9a44c,#a9741f);color:#16120a;font-size:26px;font-weight:900">✂</div>
        <h1 style="margin-bottom:6px">Рабочая тетрадь<br>начинающего барбера</h1>
        <p style="color:var(--muted);font-size:14.5px;max-width:340px;margin:0 auto">
          Теория, видео, чек-листы практики и итоговый экзамен. Прогресс сохраняется в вашем профиле.
        </p>
      </div>

      ${users.length ? `
      <div class="card mb">
        <div class="eyebrow">Продолжить обучение</div>
        ${users.map(u => `
          <div class="profile-pick" data-continue="${u.id}">
            <div class="ava">${esc(initials(u.name))}</div>
            <div style="flex:1;min-width:0">
              <b style="display:block;font-size:14.5px">${esc(u.name)}</b>
              <small>${xpOf(u.id)} XP · ${new Date(u.createdAt).toLocaleDateString("ru-RU")}</small>
            </div>
            <span style="color:var(--muted)">→</span>
          </div>`).join("")}
      </div>` : ""}

      <div class="card">
        <div class="eyebrow">Новый профиль</div>
        <form id="regForm" autocomplete="off">
          <input type="text" id="regName" placeholder="Ваше имя (например, Анна Ковалёва)" maxlength="40" required>
          <input type="password" id="regPass" class="mt-s" placeholder="Пароль (необязательно)" maxlength="40">
          <button class="btn primary wide mt" type="submit">Создать профиль и начать</button>
        </form>
        <p style="font-size:12px;color:var(--muted);margin:12px 0 0;line-height:1.5">
          Профили хранятся локально в этом браузере — это учебная песочница, а не облачный аккаунт.
        </p>
      </div>
    </div></div>`;
  }

  /* ---------------- HOME ---------------- */
  function viewHome() {
    const u = me();
    const p = prog();
    const xp = xpOf(u.id);
    const lv = levelOf(xp);
    const done = LESSONS.filter(lessonComplete).length;
    const pct = overall();
    const next = LESSONS.find(l => !lessonComplete(l) && lessonStarted(l)) || LESSONS.find(l => !lessonComplete(l)) || LESSONS[0];
    const nextMod = C.modules.find(m => m.id === next.modId);

    return shell("home", `
      <div class="hero mb">
        <div class="row between wrap" style="gap:24px">
          <div style="flex:1;min-width:260px">
            <div class="eyebrow">С возвращением, ${esc(u.name.split(" ")[0])}</div>
            <h1>${pct === 0 ? "Начнём с гигиены" : pct === 100 ? "Курс пройден — вы готовы" : "Продолжаем путь барбера"}</h1>
            <p style="color:var(--muted);margin-bottom:18px;max-width:460px">
              ${done} из ${TOTAL} тем закрыто · уровень «${lv.cur.t}» · ${xp} XP
            </p>
            <div class="row wrap" style="gap:10px">
              <a class="btn primary" href="#/lesson/${next.id}">
                ${done === 0 ? "Начать первую тему" : "Продолжить: " + esc(next.title.length > 30 ? next.title.slice(0, 30) + "…" : next.title)}
              </a>
              <a class="btn" href="#/course">Вся программа</a>
            </div>
          </div>
          <div class="ring" style="--p:${pct}"><b>${pct}%<small>курс</small></b></div>
        </div>
        <div class="bar mt"><i style="width:${pct}%"></i></div>
      </div>

      <div class="grid g4 mb">
        <div class="stat"><div class="k">Тем закрыто</div><div class="v">${done}<small> / ${TOTAL}</small></div></div>
        <div class="stat"><div class="k">Опыт</div><div class="v">${xp}<small> XP</small></div></div>
        <div class="stat"><div class="k">Уровень</div><div class="v" style="font-size:19px">${lv.cur.t}</div></div>
        <div class="stat"><div class="k">Экзамен</div><div class="v" style="font-size:19px">${p.final && p.final.passed ? '<span style="color:var(--ok)">сдан</span>' : finalUnlocked() ? "доступен" : "закрыт"}</div></div>
      </div>

      <div class="grid g2">
        <div class="card">
          <div class="row between mb"><h3 style="margin:0">Следующий шаг</h3><span class="pill gold">Модуль ${nextMod.idx}</span></div>
          <p style="color:var(--muted);font-size:13.5px;margin-bottom:14px">${esc(nextMod.title)} — тема ${next.idx}. ${esc(next.time)}</p>
          <b style="font-size:16px;display:block;margin-bottom:14px">${esc(next.title)}</b>
          <a class="btn primary sm" href="#/lesson/${next.id}">Открыть тему →</a>
        </div>

        <div class="card">
          <div class="row between mb"><h3 style="margin:0">Прогресс по модулям</h3></div>
          ${C.modules.map(m => {
            const d = m.lessons.filter(lessonComplete).length;
            return `<div style="margin-bottom:12px">
              <div class="row between" style="font-size:13px;margin-bottom:5px">
                <span>${m.idx}. ${esc(m.title)}</span>
                <span style="color:var(--muted)">${d}/${m.lessons.length}</span>
              </div>
              <div class="bar thin"><i style="width:${d / m.lessons.length * 100}%"></i></div>
            </div>`;
          }).join("")}
        </div>
      </div>

      <div class="card mt">
        <div class="row between wrap mb">
          <h3 style="margin:0">Итоговый экзамен</h3>
          <span class="pill ${finalUnlocked() ? "gold" : ""}">${finalUnlocked() ? "доступен" : "нужно " + (TOTAL - done) + " тем"}</span>
        </div>
        <p style="color:var(--muted);font-size:14px;margin-bottom:14px">
          ${C.finalTest.questions.length} вопросов по всем модулям, проходной балл 70%. После сдачи — именной сертификат.
        </p>
        <a class="btn ${finalUnlocked() ? "primary" : ""} sm" href="#/final" ${finalUnlocked() ? "" : 'style="opacity:.5"'}>${p.final && p.final.passed ? "Пройти снова" : "Перейти к экзамену"}</a>
      </div>
    `);
  }

  /* ---------------- COURSE ---------------- */
  function viewCourse() {
    return shell("course", `
      <div class="row between wrap mb">
        <div>
          <div class="eyebrow">Программа курса</div>
          <h1 style="margin-bottom:4px">${C.modules.length} модулей · ${TOTAL} тем</h1>
          <p style="color:var(--muted);margin:0">Теория · видео · чек-лист практики · мини-тест по каждой теме</p>
        </div>
        <div class="ring" style="--p:${overall()};width:88px;height:88px"><b style="font-size:19px">${overall()}%</b></div>
      </div>

      ${C.modules.map(m => {
        const d = m.lessons.filter(lessonComplete).length;
        const allDone = d === m.lessons.length;
        return `
        <div class="mod ${allDone ? "done" : ""}">
          <div class="mod-head" data-toggle="${m.id}">
            <div class="mod-num">${allDone ? "✓" : m.idx}</div>
            <div style="flex:1;min-width:0">
              <h3>${esc(m.title)}</h3>
              <div class="meta">${esc(m.subtitle)} · ${d}/${m.lessons.length} тем</div>
            </div>
            <div style="width:90px" class="no-print"><div class="bar thin"><i style="width:${d / m.lessons.length * 100}%"></i></div></div>
          </div>
          <div class="mod-body hidden" data-body="${m.id}">
            ${m.lessons.map(l => {
              const done = lessonComplete(l);
              const part = !done && lessonStarted(l);
              return `<div class="lesson-row ${done ? "ok" : part ? "partial" : ""}" data-lesson="${l.id}">
                <div class="dot">${done ? "✓" : l.idx}</div>
                <div class="t"><b>${esc(l.title)}</b><span>${l.time} · тест из ${l.quiz.length} вопр.</span></div>
                ${done ? '<span class="pill ok">пройдено</span>' : part ? '<span class="pill gold">в процессе</span>' : '<span class="pill">открыть</span>'}
              </div>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}

      <div class="card mt" style="border-color:#3a3427;background:linear-gradient(145deg,#1d1a14,#191c21)">
        <div class="row between wrap">
          <div>
            <div class="eyebrow">Финал</div>
            <h3 style="margin-bottom:4px">${C.finalTest.title}</h3>
            <p style="color:var(--muted);font-size:13.5px;margin:0">Откроется, когда все ${TOTAL} тем закрыты</p>
          </div>
          <a class="btn ${finalUnlocked() ? "primary" : ""} sm" href="#/final">${finalUnlocked() ? "Начать экзамен" : "Заблокировано"}</a>
        </div>
      </div>
    `);
  }

  /* ---------------- LESSON ---------------- */
  function viewLesson(id) {
    const l = LESSON_MAP[id];
    if (!l) return shell("course", `<div class="card"><h3>Тема не н�="btn" href="#/course">← К программе</a></div>`);
    const s = lp(id);
    const m = C.modules.find(x => x.id === l.modId);
    const videoUrl = DB.videos[id] || l.video || "";
    const nextL = LESSONS.find(x => x.globalIdx === l.globalIdx + 1);
    const checkedCount = Object.values(s.checklist || {}).filter(Boolean).length;

    return shell("course", `
      <div class="row" style="gap:8px;font-size:13px;color:var(--muted);margin-bottom:14px">
        <a href="#/course">Курс</a><span>/</span>
        <span>Модуль ${m.idx}. ${esc(m.title)}</span><span>/</span>
        <span>Тема ${l.idx}</span>
      </div>

      <div class="row between wrap mb">
        <div style="flex:1;min-width:260px">
          <h1 style="margin-bottom:6px">${esc(l.title)}</h1>
          <div class="row wrap" style="gap:8px;color:var(--muted);font-size:13.5px">
            <span>${esc(m.title)}</span><span>·</span><span>${l.time}</span>
            <span>·</span><span>Тема ${l.globalIdx} из ${TOTAL}</span>
          </div>
        </div>
        <div class="row">
          ${s.read ? '<span class="pill ok">прочитано</span>' : `<button class="btn sm" id="markRead">Отметить прочитанным</button>`}
        </div>
      </div>

      <div class="grid" style="grid-template-columns:1fr 300px;gap:18px" id="lessonGrid">
        <div>
          <div class="card theory" id="theoryBox">${l.theory}</div>

          <!-- VIDEO -->
          <div class="card mt">
            <div class="row between mb">
              <h3 style="margin:0">Учебное видео</h3>
              ${s.video ? '<span class="pill ok">просмотрено</span>' : ""}
            </div>
            ${videoUrl ? `
              <div class="video-box">${embed(videoUrl)}</div>
              <div class="row between wrap mt-s">
                <small>${esc(videoUrl)}</small>
                <div class="row" style="gap:6px">
                  ${s.video ? "" : '<button class="btn sm" id="markVideo">Смотрел ✓</button>'}
                  <button class="btn sm ghost" id="changeVideo">Заменить</button>
                </div>
              </div>
            ` : `
              <div class="video-empty">
                <div class="ico">▶</div>
                <p>Видео к этой теме ещё не добавлено. Вставьте ссылку YouTube или прямую ссылку на mp4 — оно появится здесь у всех, кто проходит этот курс в браузере.</p>
                <form id="videoForm" style="display:flex;gap:8px;width:100%;max-width:460px;margin-top:8px">
                  <input type="text" id="videoInput" placeholder="https://youtube.com/watch?v=..." style="font-size:13px">
                  <button class="btn sm primary" type="submit">OK</button>
                </form>
              </div>
            `}
          </div>

          <!-- CHECKLIST -->
          <div class="card mt">
            <div class="row between mb">
              <h3 style="margin:0">Чек-лист практики</h3>
              <span class="pill ${checkedCount === l.checklist.length ? "ok" : ""}" id="chkPill">${checkedCount}/${l.checklist.length}</span>
            </div>
            ${l.checklist.map((c, i) => `
              <label class="check">
                <input type="checkbox" data-check="${i}" ${s.checklist[i] ? "checked" : ""}>
                <span>${esc(c)}</span>
              </label>`).join("")}
            <p style="font-size:12.5px;color:var(--muted);margin:12px 0 0">
              Отмечайте по мере того, как отрабатываете приём на модели или болванке. Все пункты → +${XP_CHECK} XP.
            </p>
          </div>

          <!-- NOTES -->
          <div class="card mt">
            <div class="row between mb">
              <h3 style="margin:0">Мои заметки</h3>
              <small id="notesStatus">сохраняется автоматически</small>
            </div>
            <textarea id="notes" rows="5" placeholder="Что запомнить, где ошиблись, что переделать…">${esc(s.notes)}</textarea>
          </div>

          <!-- QUIZ -->
          <div class="card mt" id="quizCard">
            ${quizHTML(l, s)}
          </div>

          <div class="row between wrap mt" style="gap:10px">
            <a class="btn" href="#/course">← К программе</a>
            ${nextL ? `<a class="btn primary" href="#/lesson/${nextL.id}">Следующая тема →</a>` : `<a class="btn primary" href="#/final">К экзамену →</a>`}
          </div>
        </div>

        <!-- SIDEBAR -->
        <div style="position:sticky;top:80px;align-self:start" class="no-print" id="sidebar">
          <div class="card tight">
            <div class="eyebrow">Тема ${l.globalIdx} из ${TOTAL}</div>
            <div class="bar mb"><i style="width:${lessonPct(s, l)}%"></i></div>
            <div style="font-size:13px;line-height:2">
              <div class="row between"><span>${s.read ? "✓" : "○"} Теория</span><span style="color:var(--muted)">+${XP_READ}</span></div>
              <div class="row between"><span>${s.video ? "✓" : "○"} Видео</span><span style="color:var(--muted)">+${XP_VIDEO}</span></div>
              <div class="row between"><span>${checkedCount === l.checklist.length ? "✓" : "○"} Чек-лист</span><span style="color:var(--muted)">+${XP_CHECK}</span></div>
              <div class="row between"><span>${s.quizDone ? "✓" : "○"} Тест темы</span><span style="color:var(--muted)">+${l.quiz.length * XP_Q}</span></div>
            </div>
            <div class="divider" style="margin:14px 0"></div>
            <div class="eyebrow">Модуль</div>
            ${m.lessons.map(x => `
              <div class="row" style="gap:8px;padding:5px 0;font-size:13px;cursor:pointer" data-lesson="${x.id}">
                <span style="color:${x.id === l.id ? "var(--accent)" : lessonComplete(x) ? "var(--ok)" : "#4a515a"}">${lessonComplete(x) ? "✓" : "○"}</span>
                <span style="color:${x.id === l.id ? "var(--txt)" : "var(--muted)"};${x.id === l.id ? "font-weight:600" : ""}">${esc(x.title)}</span>
              </div>`).join("")}
          </div>
        </div>
      </div>
    `);
  }

  function lessonPct(s, l) {
    let n = 0, t = 4;
    if (s.read) n++;
    if (s.video || !(DB.videos[l.id] || l.video)) { if (s.video) n++; else t--; }
    if (Object.values(s.checklist || {}).filter(Boolean).length === l.checklist.length) n++;
    if (s.quizDone) n++;
    return Math.round(n / t * 100);
  }

  function embed(url) {
    const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
    if (yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    if (/\.(mp4|webm|ogg)(\?|$)/i.test(url)) return `<video src="${esc(url)}" controls playsinline></video>`;
    return `<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">
      Ссылка не распознана. Нужен YouTube или прямая ссылка на видеофайл.<br>
      <a href="${esc(url)}" target="_blank" rel="noopener">Открыть в новой вкладке →</a></div>`;
  }

  function quizHTML(l, s) {
    if (s.quizDone) {
      const pct = Math.round(s.quizBest / s.quizTotal * 100);
      const ok = pct >= 60;
      return `
        <div class="row between wrap mb">
          <h3 style="margin:0">Тест по теме</h3>
          <span class="pill ${ok ? "ok" : "bad"}">${pct}%</span>
        </div>
        <div class="callout ${ok ? "" : "warn"}"><b>${ok ? "Закрыто" : "Почти"}</b>
          Правильных ответов: ${s.quizBest} из ${s.quizTotal}. ${ok ? "Тема зачтена — можно двигаться дальше." : "Нужно минимум 60%, чтобы тема зачлась. Перечитайте разбор ниже и попробуйте снова."}
        </div>
        ${l.quiz.map((q, i) => `
          <div style="margin-bottom:16px">
            <div class="qt">${i + 1}. ${esc(q.q)}</div>
            <div class="opt right"><span class="mark">✓</span><span>${esc(q.options[q.correct])}</span></div>
            ${q.explain ? `<div class="explain">${esc(q.explain)}</div>` : ""}
          </div>`).join("")}
        <button class="btn sm" id="retakeQuiz">Пройти заново</button>`;
    }
    return `
      <div class="row between wrap mb">
        <h3 style="margin:0">Тест по теме</h3>
        <span class="pill">${l.quiz.length} вопроса</span>
      </div>
      <form id="quizForm">
        ${l.quiz.map((q, qi) => `
          <div class="q">
            <div class="qt">${qi + 1}. ${esc(q.q)}</div>
            ${q.options.map((o, oi) => `
              <label class="opt">
                <input type="radio" name="q${qi}" value="${oi}">
                <span>${esc(o)}</span>
              </label>`).join("")}
          </div>`).join("")}
        <button class="btn primary" type="submit">Проверить ответы</button>
      </form>`;
  }

  /* ---------------- FINAL ---------------- */
  let finalState = null; // {qs, answers, deadline, done}

  const FINAL_KEY = "barber_final_attempt_v1";
  function saveFinalState() {
    try {
      if (finalState && !finalState.done) sessionStorage.setItem(FINAL_KEY, JSON.stringify(finalState));
      else sessionStorage.removeItem(FINAL_KEY);
    } catch (e) {}
  }
  function restoreFinalState() {
    try {
      const raw = sessionStorage.getItem(FINAL_KEY);
      if (!raw) return;
      const st = JSON.parse(raw);
      if (st && st.qs && st.qs.length && st.deadline > Date.now()) finalState = st;
      else sessionStorage.removeItem(FINAL_KEY);
    } catch (e) {}
  }

  function shuffle(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
  }

  function viewFinal() {
    const p = prog();
    if (!finalUnlocked()) {
      const done = LESSONS.filter(lessonComplete).length;
      return shell("final", `
        <div class="card" style="max-width:560px;margin:40px auto;text-align:center;padding:40px">
          <div style="font-size:38px;margin-bottom:10px">🔒</div>
          <h2>Экзамен пока закрыт</h2>
          <p style="color:var(--muted)">Экзамен — это проверка всего курса, поэтому сначала нужно закрыть все темы. Сейчас зачтено <b>${done} из ${TOTAL}</b>.</p>
          <div class="bar mb mt"><i style="width:${done / TOTAL * 100}%"></i></div>
          <a class="btn primary" href="#/course">Вернуться к программе</a>
        </div>`);
    }

    if (p.final && p.final.passed && !finalState) return finalResultView(p.final);

    if (!finalState || finalState.done) {
      return shell("final", `
        <div class="card" style="max-width:620px;margin:20px auto;text-align:center;padding:36px">
          <div class="eyebrow">Итоговый экзамен</div>
          <h1>Все модули позади</h1>
          <p style="color:var(--muted)">${C.finalTest.questions.length} вопросов по всем шести модулям. Порог — 70%. Время — 15 минут. Порядок вопросов и вариантов перемешивается.</p>
          <div class="grid g3 mt" style="gap:10px">
            <div class="stat"><div class="k">Вопросов</div><div class="v">${C.finalTest.questions.length}</div></div>
            <div class="stat"><div class="k">Порог</div><div class="v">70<small>%</small></div></div>
            <div class="stat"><div class="k">Время</div><div class="v">15<small>мин</small></div></div>
          </div>
          ${p.final && !p.final.passed ? `<div class="callout warn mt" style="text-align:left"><b>Прошлая попытка</b>${p.final.score} из ${p.final.total} — порог не достигнут. Можно попробовать снова.</div>` : ""}
          <button class="btn primary mt" id="startFinal" style="padding:14px 28px">Начать экзамен</button>
        </div>`);
    }

    const fs = finalState;
    return shell("final", `
      <div class="row between wrap mb">
        <div>
          <div class="eyebrow">Идёт экзамен</div>
          <h2 style="margin:0" id="finalProgress">Отвечено ${Object.keys(fs.answers).length} из ${fs.qs.length}</h2>
        </div>
        <div class="row" style="gap:10px">
          <span class="pill">⏱ <span class="timer" id="timer">--:--</span></span>
          <button class="btn primary sm" id="submitFinal">Завершить</button>
        </div>
      </div>
      <div class="bar mb"><i style="width:${Object.keys(fs.answers).length / fs.qs.length * 100}%" id="finalBar"></i></div>
      <form id="finalForm">
        ${fs.qs.map((q, qi) => `
          <div class="card mb" style="padding:18px">
            <div class="qt">${qi + 1}. ${esc(q.q)}</div>
            ${q.opts.map((o, oi) => `
              <label class="opt">
                <input type="radio" name="f${qi}" value="${oi}" ${fs.answers[qi] === oi ? "checked" : ""}>
                <span>${esc(o)}</span>
              </label>`).join("")}
          </div>`).join("")}
      </form>
      <div style="height:80px"></div>
      <div style="position:fixed;bottom:0;left:0;right:0;background:rgba(13,14,16,.92);border-top:1px solid var(--line);padding:12px;backdrop-filter:blur(10px);z-index:30">
        <div class="wrap row between">
          <small style="color:var(--muted)">Ответы не сохраняются, если закрыть вкладку</small>
          <button class="btn primary" id="submitFinal2">Завершить экзамен</button>
        </div>
      </div>
    `);
  }

  function finalResultView(res) {
    const pct = Math.round(res.score / res.total * 100);
    const u = me();
    return shell("final", `
      <div class="card" style="max-width:620px;margin:0 auto 18px;text-align:center;padding:34px">
        <div class="eyebrow">Результат</div>
        <div class="score-big" style="color:${pct >= 70 ? "var(--ok)" : "var(--bad)"}">${pct}%</div>
        <p style="color:var(--muted);margin-top:8px">${res.score} правильных из ${res.total}</p>
        <h2 style="margin-top:14px">${pct === 100 ? "Безупречно" : pct >= 70 ? "Экзамен сдан" : "Нужно повторить"}</h2>
        <p style="color:var(--muted);max-width:420px;margin:0 auto">
          ${pct >= 70
            ? "Все ключевые темы усвоены: гигиена, инструменты, текстуры, фейд и работа с контуром. Сертификат ниже."
            : "Порог — 70%. Вернитесь к темам, где были ошибки, и попробуйте ещё раз — попытки не ограничены."}
        </p>
        <div class="row" style="justify-content:center;gap:10px;margin-top:20px">
          <a class="btn" href="#/course">К программе</a>
          <button class="btn primary" id="retakeFinal">Ещё попытка</button>
        </div>
      </div>

      ${pct >= 70 ? `
      <div class="cert no-print-bg" id="cert" style="max-width:720px;margin:0 auto">
        <div class="seal">✂</div>
        <div class="meta">Barber Workbook · сертификат</div>
        <h2>Курс начинающего барбера пройден</h2>
        <div class="who">${esc(u.name)}</div>
        <p style="max-width:440px;margin:0 auto;font-size:14px;color:#4a3f2a">
          Итоговый экзамен сдан с результатом ${res.score} из ${res.total} (${pct}%).
          Освоены модули: гигиена и безопасность, инструменты, типы волос, техники стрижки, фейд, работа машинкой.
        </p>
        <div class="meta mt" style="color:#6d5c3a">${new Date(res.date).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" })}</div>
      </div>
      <div class="row" style="justify-content:center;margin-top:16px" class="no-print">
        <button class="btn" onclick="window.print()">🖨 Распечатать сертификат</butprint()">🖨 Распечатать сертификат</button>
      </div>` : ""}
    `);
  }

  /* ---------------- PROFILE ---------------- */
  function viewProfile() {
    const u = me();
    const xp = xpOf(u.id);
    const lv = levelOf(xp);
    const p = prog();
    const done = LESSONS.filter(lessonComplete).length;
    const quizzes = LESSONS.filter(l => { const s = p.lessons[l.id]; return s && s.quizDone; });
    const avg = quizzes.length ? Math.round(quizzes.reduce((a, l) => a + p.lessons[l.id].quizBest / p.lessons[l.id].quizTotal, 0) / quizzes.length * 100) : 0;

    const badges = [
      { i: "🧼", t: "Чистые руки", d: "Модуль гигиены закрыт на 100%", on: C.modules[0].lessons.every(lessonComplete) },
      { i: "✂️", t: "Инструментовед", d: "Все темы об инструментах", on: C.modules[1].lessons.every(lessonComplete) },
      { i: "🌀", t: "Фейд-новичок", d: "Модуль фейда закрыт", on: C.modules[4].lessons.every(lessonComplete) },
      { i: "🔥", t: "Серия", d: "5 тем подряд зачтены", on: LESSONS.slice(0, 5).every(lessonComplete) },
      { i: "📝", t: "Конспект", d: "Заметки в 5+ темах", on: Object.values(p.lessons).filter(s => (s.notes || "").trim().length > 10).length >= 5 },
      { i: "🎓", t: "Экзамен сдан", d: "Итоговый тест ≥ 70%", on: !!(p.final && p.final.passed) }
    ];

    return shell("profile", `
      <div class="card mb">
        <div class="row wrap" style="gap:20px">
          <div class="ava" style="width:70px;height:70px;font-size:24px">${esc(initials(u.name))}</div>
          <div style="flex:1;min-width:200px">
            <h1 style="margin-bottom:4px">${esc(u.name)}</h1>
            <div class="row wrap" style="gap:8px">
              <span class="pill gold">Уровень ${lv.cur.n} · ${lv.cur.t}</span>
              <span class="pill">${xp} XP</span>
              <span class="pill">${done}/${TOTAL} тем</span>
            </div>
            ${lv.next ? `
            <div class="mt-s">
              <div class="row between" style="font-size:12px;color:var(--muted);margin-bottom:4px">
                <span>До «${lv.next.t}»</span><span>${lv.next.at - xp} XP</span>
              </div>
              <div class="bar thin"><i style="width:${Math.min(100, (xp - lv.cur.at) / (lv.next.at - lv.cur.at) * 100)}%"></i></div>
            </div>` : `<small style="display:block;margin-top:8px">Максимальный уровень достигнут — вы гроза затылков.</small>`}
          </div>
          <div class="ring" style="--p:${overall()}"><b>${overall()}%<small>курс</small></b></div>
        </div>
      </div>

      <div class="grid g3 mb">
        <div class="stat"><div class="k">Средний балл тестов</div><div class="v">${avg}<small>%</small></div></div>
        <div class="stat"><div class="k">Тестов пройдено</div><div class="v">${quizzes.length}<small> / ${TOTAL}</small></div></div>
        <div class="stat"><div class="k">Экзамен</div><div class="v">${p.final ? p.final.score + "<small>/" + p.final.total + "</small>" : "—"}</div></div>
      </div>

      <div class="card mb">
        <h3>Достижения</h3>
        <div class="grid badges" style="grid-template-columns:1fr 1fr;gap:10px">
          ${badges.map(b => `
            <div class="badge ${b.on ? "" : "off"}">
              <div class="bi">${b.i}</div>
              <div><b>${b.t}</b><small>${b.d}</small></div>
            </div>`).join("")}
        </div>
      </div>

      <div class="card mb">
        <h3>Детально по темам</h3>
        <table>
          <thead><tr><th>Тема</th><th>Тест</th><th>Статус</th></tr></thead>
          <tbody>
          ${LESSONS.map(l => {
            const s = p.lessons[l.id] || {};
            const pct = s.quizTotal ? Math.round(s.quizBest / s.quizTotal * 100) : null;
            return `<tr>
              <td>${l.globalIdx}. ${esc(l.title)}</td>
              <td style="color:${pct == null ? "var(--muted)" : pct >= 60 ? "var(--ok)" : "var(--bad)"}">${pct == null ? "—" : pct + "%"}</td>
              <td>${lessonComplete(l) ? '<span class="pill ok">зачтено</span>' : lessonStarted(l) ? '<span class="pill gold">в процессе</span>' : '<span class="pill">не начато</span>'}</td>
            </tr>`;
          }).join("")}
          </tbody>
        </table>
      </div>

      <div class="card">
        <h3>Аккаунт</h3>
        <div class="row wrap" style="gap:10px">
          <button class="btn sm" id="logout">Выйти</button>
          <button class="btn sm" id="resetProgress">Сбросить прогресс</button>
          <button class="btn sm" id="deleteProfile" style="color:var(--bad)">Удалить профиль</button>
        </div>
        <p style="font-size:12px;color:var(--muted);margin:12px 0 0">Вход выполнен ${new Date(u.createdAt).toLocaleDateString("ru-RU")}. Данные хранятся в localStorage браузера.</p>
      </div>
    `);
  }

  /* ---------------- RATING ---------------- */
  function viewRating() {
    const u = me();
    const rows = Object.values(DB.users).map(x => ({
      id: x.id, name: x.name, xp: xpOf(x.id), bot: false, me: x.id === u.id,
      done: LESSONS.filter(l => {
        const s = (DB.progress[x.id] || { lessons: {} }).lessons[l.id];
        return s && s.quizDone && s.quizTotal > 0 && (s.quizBest / s.quizTotal) >= 0.6;
      }).length
    }));
    C.bots.forEach(b => rows.push({
      id: b.name, name: b.name, xp: Math.round(b.skill * 9), bot: true, me: false,
      done: Math.round(b.skill / 100 * TOTAL)
    }));
    rows.sort((a, b) => b.xp - a.xp || b.done - a.done);
    const myRank = rows.findIndex(r => r.me) + 1;

    return shell("rating", `
      <div class="row between wrap mb">
        <div>
          <div class="eyebrow">Рейтинг учеников</div>
          <h1 style="margin-bottom:4px">Ваше место: ${myRank} из ${rows.length}</h1>
          <p style="color:var(--muted);margin:0">Считается по XP: теория, видео, чек-листы и тесты. Группа — демонстрационная.</p>
        </div>
        <div class="ring" style="--p:${Math.max(4, 100 - (myRank - 1) / rows.length * 100)};width:88px;height:88px"><b style="font-size:17px">${myRank}<small>место</small></b></div>
      </div>

      <div class="card">
        ${rows.map((r, i) => `
          <div class="rank ${r.me ? "me" : ""}">
            <div class="pos" style="color:${i === 0 ? "var(--accent)" : "inherit"}">${i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : i + 1}</div>
            <div class="ava" style="background:${r.me ? "var(--accent)" : r.bot ? "#3a4149" : "#4a5a4a"};color:${r.bot ? "#dfe4ea" : "#14100a"}">${esc(initials(r.name))}</div>
            <div style="flex:1;min-width:0">
              <b style="font-size:14.5px">${esc(r.name)}${r.me ? ' <span class="pill gold" style="margin-left:4px">вы</span>' : ""}</b>
              <div style="font-size:12px;color:var(--muted)">${r.done}/${TOTAL} тем ${r.bot ? "· демо-профиль" : ""}</div>
            </div>
            <div class="num">${r.xp}<span style="font-size:11px;color:var(--muted);font-weight:600"> XP</span></div>
          </div>`).join("")}
      </div>

      <div class="card mt">
        <h3>Как начисляется опыт</h3>
        <table>
          <tbody>
            <tr><td>Отметить теорию прочитанной</td><td style="text-align:right;color:var(--accent2)">+${XP_READ} XP</td></tr>
            <tr><td>Отметить видео просмотренным</td><td style="text-align:right;color:var(--accent2)">+${XP_VIDEO} XP</td></tr>
            <tr><td>Закрыть весь чек-лист темы</td><td style="text-align:right;color:var(--accent2)">+${XP_CHECK} XP</td></tr>
            <tr><td>Каждый верный ответ в тесте темы</td><td style="text-align:right;color:var(--accent2)">+${XP_Q} XP</td></tr>
            <tr><td>Каждый верный ответ на экзамене</td><td style="text-align:right;color:var(--accent2)">+${XP_FINAL_Q} XP</td></tr>
          </tbody>
        </table>
      </div>
    `);
  }

  /* ---------------- events ---------------- */
  function postRender(r) {
    // auth
    const regForm = document.getElementById("regForm");
    if (regForm) {
      regForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("regName").value.trim();
        const pass = document.getElementById("regPass").value;
        if (name.length < 2) { toast("Имя — минимум 2 символа"); return; }
        if (Object.values(DB.users).some(x => x.name.toLowerCase() === name.toLowerCase())) {
          toast("Такое имя уже занято"); return;
        }
        const id = uid();
        DB.users[id] = { id, name, pass: pass ? hash(pass) : null, createdAt: Date.now() };
        DB.progress[id] = { lessons: {}, final: null };
        DB.session = id;
        save();
        toast("Профиль создан. Погнали ✂");
        go("#/home");
      });
    }
    document.querySelectorAll("[data-continue]").forEach(el => {
      el.addEventListener("click", () => {
        const id = el.getAttribute("data-continue");
        const u = DB.users[id];
        if (u && u.pass) {
          const p = prompt("Пароль для профиля «" + u.name + "»:");
          if (p == null) return;
          if (hash(p) !== u.pass) { toast("Неверный пароль"); return; }
        }
        DB.session = id; save(); go("#/home");
      });
    });

    // course toggles
    document.querySelectorAll("[data-toggle]").forEach(el => {
      el.addEventListener("click", () => {
        const body = document.querySelector('[data-body="' + el.getAttribute("data-toggle") + '"]');
        if (body) body.classList.toggle("hidden");
      });
    });
    document.querySelectorAll("[data-lesson]").forEach(el => {
      el.addEventListener("click", () => go("#/lesson/" + el.getAttribute("data-lesson")));
    });

    // ---- lesson page ----
    if (r.name === "lesson" && LESSON_MAP[r.arg]) {
      const l = LESSON_MAP[r.arg];
      const s = lp(l.id);

      const markRead = document.getElementById("markRead");
      if (markRead) markRead.addEventListener("click", () => {
        s.read = true; save(); toast("Теория зачтена, +" + XP_READ + " XP");
        render();
      });

      const markVideo = document.getElementById("markVideo");
      if (markVideo) markVideo.addEventListener("click", () => {
        s.video = true; save(); toast("Видео зачтено, +" + XP_VIDEO + " XP"); render();
      });

      const videoForm = document.getElementById("videoForm");
      if (videoForm) videoForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const v = document.getElementById("videoInput").value.trim();
        if (!v) return;
        DB.videos[l.id] = v; save(); toast("Видео добавлено"); render();
      });

      const changeVideo = document.getElementById("changeVideo");
      if (changeVideo) changeVideo.addEventListener("click", () => {
        const v = prompt("Новая ссылка на видео (пусто — удалить):", DB.videos[l.id] || "");
        if (v === null) return;
        if (!v.trim()) delete DB.videos[l.id]; else DB.videos[l.id] = v.trim();
        save(); render();
      });

      document.querySelectorAll("[data-check]").forEach(cb => {
        cb.addEventListener("change", () => {
          const i = +cb.getAttribute("data-check");
          s.checklist[i] = cb.checked;
          save();
          const doneAll = l.checklist.every((_, k) => !!s.checklist[k]);
          const cnt = l.checklist.filter((_, k) => !!s.checklist[k]).length;
          const pill = document.getElementById("chkPill");
          if (pill) {
            pill.textContent = cnt + "/" + l.checklist.length;
            pill.classList.toggle("ok", doneAll);
          }
          const mk = document.getElementById("chkMark");
          if (mk) mk.textContent = doneAll ? "✓" : "○";
          if (cb.checked && doneAll) toast("Чек-лист закрыт! +" + XP_CHECK + " XP");
        });
      });

      const notes = document.getElementById("notes");
      if (notes) {
        let t;
        notes.addEventListener("input", () => {
          s.notes = notes.value;
          const st = document.getElementById("notesStatus");
          if (st) st.textContent = "сохранение…";
          clearTimeout(t);
          t = setTimeout(() => {
            save();
            if (st) st.textContent = "сохранено ✓";
          }, 500);
        });
      }

      const qf = document.getElementById("quizForm");
      if (qf) qf.addEventListener("submit", (e) => {
        e.preventDefault();
        let correct = 0;
        let unanswered = 0;
        l.quiz.forEach((q, qi) => {
          const chosen = qf.querySelector('input[name="q' + qi + '"]:checked');
          if (!chosen) { unanswered++; return; }
          if (+chosen.value === q.correct) correct++;
        });
        if (unanswered > 0) { toast("Ответьте на все вопросы (" + unanswered + " осталось)"); return; }
        s.quizDone = true;
        s.quizTotal = l.quiz.length;
        s.quizBest = Math.max(s.quizBest || 0, correct);
        if (!s.read) s.read = true;
        save();
        const pct = Math.round(correct / l.quiz.length * 100);
        toast(pct >= 60 ? "Зачтено: " + pct + "% · +" + correct * XP_Q + " XP" : "Только " + pct + "% — нужно 60%");
        render();
        const qc = document.getElementById("quizCard");
        if (qc) qc.scrollIntoView({ behavior: "smooth", block: "center" });
      });

      const rq = document.getElementById("retakeQuiz");
      if (rq) rq.addEventListener("click", () => {
        s.quizDone = false; save(); render();
      });
    }

    // ---- final ----
    if (r.name === "final") {
      const start = document.getElementById("startFinal");
      if (start) start.addEventListener("click", () => {
        const qs = shuffle(C.finalTest.questions.map(q => {
          const opts = shuffle(q.options.map((o, i) => ({ o, i })));
          return {
            q: q.q,
            opts: opts.map(x => x.o),
            correct: opts.findIndex(x => x.i === q.correct)
          };
        }));
        finalState = { qs, answers: {}, started: Date.now(), deadline: Date.now() + 15 * 60 * 1000, done: false };
        saveFinalState();
        render();
        startTimer();
      });

      const submit = () => {
        if (!finalState) return;
        const unanswered = finalState.qs.length - Object.keys(finalState.answers).length;
        if (unanswered > 0 && !confirm("Осталось " + unanswered + " без ответа. Завершить?")) return;
        gradeFinal();
      };
      const s1 = document.getElementById("submitFinal");
      const s2 = document.getElementById("submitFinal2");
      if (s1) s1.addEventListener("click", submit);
      if (s2) s2.addEventListener("click", submit);

      document.querySelectorAll('#finalForm input[type="radio"]').forEach(inp => {
        inp.addEventListener("change", () => {
          const qi = +inp.name.replace("f", "");
          finalState.answers[qi] = +inp.value;
          saveFinalState();
          inp.closest(".card").querySelectorAll(".opt").forEach(o => o.classList.remove("sel"));
          inp.closest(".opt").classList.add("sel");
          const b = document.getElementById("finalBar");
          if (b) b.style.width = (Object.keys(finalState.answers).length / finalState.qs.length * 100) + "%";
          const h = document.querySelector(".eyebrow + h2");
          if (h) h.textContent = "Отвечено " + Object.keys(finalState.answers).length + " из " + finalState.qs.length;
        });
      });
      if (finalState && !finalState.done) startTimer();

      const retake = document.getElementById("retakeFinal");
      if (retake) retake.addEventListener("click", () => {
        const p0 = prog();
        hideSavedResult = !!(p0.final && p0.final.passed);
        finalState = null; saveFinalState(); render();
      });
    }

    // ---- profile ----
    const logout = document.getElementById("logout");
    if (logout) logout.addEventListener("click", () => {
      DB.session = null; save(); go("#/auth");
    });
    const rp = document.getElementById("resetProgress");
    if (rp) rp.addEventListener("click", () => {
      if (!confirm("Сбросить весь прогресс курса? Заметки тоже удалятся.")) return;
      DB.progress[DB.session] = { lessons: {}, final: null };
      save(); toast("Прогресс сброшен"); render();
    });
    const dp = document.getElementById("deleteProfile");
    if (dp) dp.addEventListener("click", () => {
      if (!confirm("Удалить профиль «" + me().name + "» без возможности восстановления?")) return;
      delete DB.users[DB.session];
      delete DB.progress[DB.session];
      DB.session = null; save(); go("#/auth");
    });
  }

  let timerInt = null;
  function startTimer() {
    clearInterval(timerInt);
    const tick = () => {
      const el = document.getElementById("timer");
      if (!el || !finalState || finalState.done) { clearInterval(timerInt); return; }
      const left = Math.max(0, finalState.deadline - Date.now());
      const m = Math.floor(left / 60000);
      const sec = Math.floor(left % 60000 / 1000);
      el.textContent = m + ":" + String(sec).padStart(2, "0");
      el.classList.toggle("low", left < 120000);
      if (left <= 0) { clearInterval(timerInt); toast("Время вышло — экзамен завершён"); gradeFinal(); }
    };
    tick();
    timerInt = setInterval(tick, 1000);
  }

  function gradeFinal() {
    if (!finalState) return;
    let score = 0;
    finalState.qs.forEach((q, i) => { if (finalState.answers[i] === q.correct) score++; });
    const total = finalState.qs.length;
    const passed = score / total >= 0.7;
    const res = { score, total, passed, date: Date.now() };
    const p = prog();
    if (!p.final || score > p.final.score || passed) p.final = res;
    finalState.done = true;
    saveFinalState();
    clearInterval(timerInt);
    save();
    app().innerHTML = finalResultView(res);
    window.scrollTo(0, 0);
    postRender({ name: "final" });
    toast(passed ? "Экзамен сдан 🎓" : "Пока не хватает баллов");
  }

  // expose for inline handlers

  window.__wb = { DB, save, xpOf };
})();

</script>
</body>
</html>
